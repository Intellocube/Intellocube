<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script type="text/javascript" src="https://embeds.iubenda.com/widgets/9fc8cffd-0754-4684-99a7-ac4836404e25.js"></script>
<script>
/* Re-skin the Iubenda cookie banner to match the site's palette/fonts.
   Iubenda's own rules use an #iubenda-cs-banner-prefixed selector with
   high specificity, so ours must match that exactly (and be injected
   after the banner renders) to win the cascade. */
(function () {
  function applyIubendaTheme() {
    var s = document.createElement('style');
    s.textContent =
      '#iubenda-cs-banner .iubenda-banner-content:not(.iubenda-custom-content) *,' +
      '#iubenda-cs-banner [class*=" iub"],' +
      '#iubenda-cs-banner [class^="iub"] { font-family: "Nexa", "Nunito", "Avenir Next", "Trebuchet MS", sans-serif !important; }' +
      '#iubenda-cs-banner .iubenda-cs-opt-group button.iubenda-cs-customize-btn {' +
      'background: transparent !important; border: 1px solid rgba(255,255,255,0.09) !important; color: #F0EAF8 !important; }' +
      '#iubenda-cs-banner .iubenda-cs-opt-group button.iubenda-cs-accept-btn,' +
      '#iubenda-cs-banner .iubenda-cs-opt-group button.iubenda-cs-btn-primary {' +
      'background: #E40E74 !important; color: #fff !important; }' +
      '#iubenda-cs-banner .iubenda-banner-content a.iubenda-privacy-policy-link,' +
      '#iubenda-cs-banner .iubenda-banner-content a.iubenda-cs-cookie-policy-lnk {' +
      'color: #3997D3 !important; }';
    document.head.appendChild(s);
  }
  var applied = false;
  var mo = new MutationObserver(function () {
    if (!applied && document.getElementById('iubenda-cs-banner')) {
      applied = true;
      applyIubendaTheme();
      mo.disconnect();
    }
  });
  mo.observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<meta name="theme-color" content="#341B4B"/>
<title>Page Not Found — Intellocube</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* Iubenda cookie banner — force-wrap so its content never exceeds
   the viewport width; without this, an overflowing toggle row
   forces the whole page's mobile layout viewport wider than the
   device, zooming the entire site out. */
.iubenda-cs-default-floating, .iubenda-cs-container, .iubenda-cs-content,
.iubenda-cs-rationale, .iubenda-banner-content, .iubenda-granular-controls-container,
.iubenda-cs-opt-group, .iubenda-cs-opt-group-custom, .iubenda-cs-opt-group-granular,
.iubenda-cs-opt-group-consent, .iubenda-cs-small-margin-top {
  max-width: 100vw !important;
  width: auto !important;
  box-sizing: border-box !important;
  flex-wrap: wrap !important;
}
.iubenda-cs-opt-group-granular > *, .iubenda-cs-opt-group-consent > * {
  white-space: normal !important;
}
@font-face { font-family: 'Nexa'; src: url('assets/fonts/Nexa-Light.ttf') format('truetype'); font-weight: 300; font-display: swap; }
@font-face { font-family: 'Nexa'; src: url('assets/fonts/Nexa-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Nunito', 'Avenir Next', 'Trebuchet MS', sans-serif;
  background: radial-gradient(circle at 30% 20%, #402060 0%, #341B4B 55%, #2C1840 100%);
  color: #F0EAF8; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 2rem;
}
.wrap { max-width: 480px; display: flex; flex-direction: column; align-items: center; gap: 1.1rem; }
.code {
  font-family: 'Nexa', var(--font-body); font-weight: 700;
  font-size: clamp(3.5rem, 10vw, 6rem); line-height: 1;
  background: linear-gradient(90deg, #3997D3, #E40E74, #FCE800);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
h1 { font-family: 'Nexa', var(--font-body); font-weight: 700; font-size: 1.5rem; color: #fff; }
p { color: #C9B8E0; font-size: 0.95rem; line-height: 1.7; }
.home-btn {
  margin-top: 0.6rem; display: inline-block; text-decoration: none;
  background: #E40E74; color: #fff; font-weight: 700; font-size: 0.85rem;
  letter-spacing: 0.05em; padding: 0.8rem 1.8rem; border-radius: 99px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.home-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(228,14,116,0.35); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page went unannotated.</h1>
    <p>We couldn't find the page you were looking for. It may have moved, or the link might be out of date.</p>
    <a class="home-btn" href="/">← Back to Intellocube</a>
  </div>
</body>
</html>
