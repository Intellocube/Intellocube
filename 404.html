<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script type="text/javascript" src="https://embeds.iubenda.com/widgets/9fc8cffd-0754-4684-99a7-ac4836404e25.js"></script>
<script>
/* Re-skin the Iubenda cookie banner to match the site's palette/fonts.
   Iubenda's own rules use an #iubenda-cs-banner-prefixed selector with
   high specificity, so ours must match that exactly (and be injected
   after the banner renders) to win the cascade. */
(function () {
  function applyIubendaTheme() {
    var s = document.createElement('style');
    s.textContent =
      '#iubenda-cs-banner .iubenda-banner-content:not(.iubenda-custom-content) *,' +
      '#iubenda-cs-banner [class*=" iub"],' +
      '#iubenda-cs-banner [class^="iub"] { font-family: "Nexa", "Nunito", "Avenir Next", "Trebuchet MS", sans-serif !important; }' +
      '#iubenda-cs-banner .iubenda-cs-opt-group button.iubenda-cs-customize-btn {' +
      'background: transparent !important; border: 1px solid rgba(255,255,255,0.09) !important; color: #F0EAF8 !important; }' +
      '#iubenda-cs-banner .iubenda-cs-opt-group button.iubenda-cs-accept-btn,' +
      '#iubenda-cs-banner .iubenda-cs-opt-group button.iubenda-cs-btn-primary {' +
      'background: #E40E74 !important; color: #fff !important; }' +
      '#iubenda-cs-banner .iubenda-banner-content a.iubenda-privacy-policy-link,' +
      '#iubenda-cs-banner .iubenda-banner-content a.iubenda-cs-cookie-policy-lnk {' +
      'color: #3997D3 !important; }';
    document.head.appendChild(s);
    /* The banner's background/text color are set via an inline
       style="...!important" attribute, which no stylesheet rule can
       out-rank — only overwriting that same inline declaration wins. */
    var content = document.querySelector('.iubenda-cs-content');
    if (content) {
      content.style.setProperty('background-color', '#2C1840', 'important');
      content.style.setProperty('color', '#F0EAF8', 'important');
    }
  }
  /* The "Notice at collection / Your Privacy Choices" US-state-privacy
     bar and its floating preferences icon — shown only to visitors
     Iubenda detects as being in a US state with its own privacy law,
     so it can't be tested from here. Styled by directly overwriting
     inline styles (always wins over any stylesheet, no specificity
     fight needed) rather than a <style> override. Re-applied on every
     poll tick (idempotent) since this widget can render before this
     script's MutationObserver even attaches, and a one-shot check can
     miss it entirely. */
  function applyUSPrivacyTheme() {
    var widget = document.querySelector('.iub__us-widget');
    if (widget) {
      widget.style.setProperty('background-color', '#2C1840', 'important');
      var wrapper = widget.querySelector('.iub__us-widget__wrapper');
      if (wrapper) wrapper.style.setProperty('background-color', '#2C1840', 'important');
      var links = widget.querySelectorAll('.iub__us-widget__link');
      for (var i = 0; i < links.length; i++) {
        links[i].style.setProperty('background-color', '#2C1840', 'important');
        links[i].style.setProperty('color', '#F0EAF8', 'important');
        links[i].style.setProperty('font-family', '"Nexa", "Nunito", "Avenir Next", "Trebuchet MS", sans-serif', 'important');
      }
      /* The blue checkmark/X pill next to "Your Privacy Choices" is
         generated via ::after { content: url(...) } — a different
         data-URI SVG technique than the keyhole icon's background-
         image. Pseudo-elements can't take inline JS styles, so this
         needs an actual stylesheet rule with a matching selector. */
      if (!document.getElementById('iub-uspr-icon-style')) {
        var usprStyle = document.createElement('style');
        usprStyle.id = 'iub-uspr-icon-style';
        usprStyle.textContent =
          '.iub__us-widget__link--privacy-choices::after { content: url(data:image/svg+xml,' +
          '%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2740%27%20height=%2718%27%20viewBox=%270%200%2040%2018%27%3E' +
          '%3Crect%20x=%270.5%27%20y=%270.5%27%20width=%2739%27%20height=%2717%27%20rx=%278.5%27%20fill=%27%233997D3%27/%3E' +
          '%3Cpath%20d=%27M8%209.5L10.5%2012L16.5%206%27%20stroke=%27white%27%20stroke-width=%271.5%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%20fill=%27none%27/%3E' +
          '%3Cpath%20d=%27M25.5%206L31.5%2012%27%20stroke=%27white%27%20stroke-width=%271.5%27%20stroke-linecap=%27round%27/%3E' +
          '%3Cpath%20d=%27M31.5%206L25.5%2012%27%20stroke=%27white%27%20stroke-width=%271.5%27%20stroke-linecap=%27round%27/%3E' +
          '%3C/svg%3E) !important; }';
        document.head.appendChild(usprStyle);
      }
    }
    /* Floating preferences icon: purple/semi-transparent backdrop.
       The green keyhole graphic's rendering mechanism is unknown (SVG
       fill, an <img>, or a masked element using background-color as
       its fill) since this widget can't be reproduced here, so every
       descendant gets a brightness(0) invert(1) filter — that forces
       any single-color icon to pure white regardless of its original
       color or how it's drawn, without touching the button's own
       purple background (the filter is applied to the icon graphic
       elements, not to .iubenda-tp-btn itself). */
    /* Floating preferences icon: confirmed via live inspection that
       the green keyhole is a background-image (a hardcoded SVG,
       fill #1CC691) painted directly on .iubenda-tp-btn itself — it
       has no child elements, just a hidden sr-only label. Replaced
       with an equivalent keyhole SVG in the site's cyan instead of
       Iubenda's green. */
    /* querySelectorAll, not querySelector — a second copy of this
       icon appears inside the "Your Privacy Choices" detail panel,
       and only styling the first instance found left that one green. */
    var icons = document.querySelectorAll('.iubenda-tp-btn');
    for (var ic = 0; ic < icons.length; ic++) {
      var icon = icons[ic];
      icon.style.setProperty('background-color', 'rgba(52,27,75,0.7)', 'important');
      icon.style.setProperty(
        'background-image',
        'url(data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%2732%27%20height=%2732%27%20viewBox=%270%200%2032%2032%27%3E%3Ccircle%20cx=%2716%27%20cy=%2712%27%20r=%275%27%20fill=%27%233997D3%27/%3E%3Cpath%20d=%27M13%2016h6l2%2010H11z%27%20fill=%27%233997D3%27/%3E%3C/svg%3E)',
        'important'
      );
      icon.style.setProperty('background-size', '60%', 'important');
      icon.style.setProperty('background-position', 'center', 'important');
      icon.style.setProperty('background-repeat', 'no-repeat', 'important');
      icon.style.setProperty('color', '#fff', 'important');
    }
  }
  /* The detailed "Your Privacy Choices" panel opened via "Learn more"
     is built from several separate pieces, not one container. A full
     scan for opaque light backgrounds while the panel was open found:
       #purposes-container (.iubenda-modal-navigation) — the top
         header bar (back button, "See full Privacy Policy") — this
         one alone is inline-locked, style="...!important", same as
         the main banner, so it needs the inline-overwrite trick.
       .iubenda-iframe-top-container, .iubenda-cs-consent-buttons /
       .purposes-buttons, .purposes-section-body-items,
       .iubenda-iframe-footer — the button bar, content wrapper, and
         footer bar — none of these had an inline style, so a normal
         stylesheet rule with !important is enough to win.
       .iub-btn-reject / .iub-btn-accept — the actual buttons. */
  function applyPurposesPanelTheme() {
    var panel = document.getElementById('purposes-content-container');
    if (panel) {
      panel.style.setProperty('background-color', '#2C1840', 'important');
      panel.style.setProperty('color', '#F0EAF8', 'important');
    }
    var navHeader = document.getElementById('purposes-container');
    if (navHeader) {
      navHeader.style.setProperty('background-color', '#2C1840', 'important');
    }
    if (!document.getElementById('iub-purposes-theme-style')) {
      var s = document.createElement('style');
      s.id = 'iub-purposes-theme-style';
      s.textContent =
        '#purposes-content-container, #purposes-content-container *,' +
        '#purposes-container, #purposes-container *,' +
        '.iubenda-iframe-top-container, .iubenda-iframe-top-container *,' +
        '.iubenda-iframe-footer, .iubenda-iframe-footer *' +
        '{ font-family: "Nexa", "Nunito", "Avenir Next", "Trebuchet MS", sans-serif !important; }' +
        '.iubenda-iframe-top-container, .iubenda-cs-consent-buttons, .purposes-buttons,' +
        '.purposes-section-body-items, .iubenda-iframe-footer' +
        '{ background-color: #2C1840 !important; }' +
        '#purposes-content-container h1, #purposes-content-container h2, #purposes-content-container h3,' +
        '#purposes-content-container p, #purposes-content-container span, #purposes-content-container label,' +
        '#purposes-content-container li,' +
        '.purposes-section-body-items h1, .purposes-section-body-items h2, .purposes-section-body-items h3,' +
        '.purposes-section-body-items p, .purposes-section-body-items span, .purposes-section-body-items label,' +
        '.purposes-section-body-items li' +
        '{ color: #F0EAF8 !important; }' +
        '#purposes-content-container a, .purposes-section-body-items a { color: #3997D3 !important; }' +
        '#purposes-content-container button, .iub-btn-consent, #purposes-container button, #purposes-container a' +
        '{ background: rgba(255,255,255,0.08) !important; color: #F0EAF8 !important; border-color: rgba(255,255,255,0.2) !important; }';
      document.head.appendChild(s);
    }
  }
  var bannerApplied = false;
  var mo = new MutationObserver(function () {
    if (!bannerApplied && document.getElementById('iubenda-cs-banner')) {
      bannerApplied = true;
      applyIubendaTheme();
      mo.disconnect();
    }
  });
  mo.observe(document.documentElement, { childList: true, subtree: true });
  /* Runs indefinitely rather than stopping after N tries — this
     widget's geo-check delay is unpredictable, and testing showed a
     fixed 20s window can expire before the widget actually appears,
     silently leaving it unthemed with no second chance. */
  setInterval(function () {
    if (document.querySelector('.iub__us-widget') || document.querySelector('.iubenda-tp-btn')) {
      applyUSPrivacyTheme();
    }
    if (document.getElementById('purposes-content-container') || document.getElementById('purposes-container')) {
      applyPurposesPanelTheme();
    }
  }, 1000);
})();
</script>

   the viewport width; without this, an overflowing toggle row
   forces the whole page's mobile layout viewport wider than the
   device, zooming the entire site out. */

.iubenda-cs-rationale, .iubenda-banner-content, .iubenda-granular-controls-container,
.iubenda-cs-opt-group, .iubenda-cs-opt-group-custom, .iubenda-cs-opt-group-granular,

#iub-legal-footer {
